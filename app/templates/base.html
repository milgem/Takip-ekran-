<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f4d3f">
<title>{% block title %}Panel{% endblock %}</title>
<script>try{var t=localStorage.getItem('tema');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=21">
<script src="/static/app.js?v=21"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/"><i></i>Panel</a>
  <nav class="main">
    <a href="/" class="{{ 'on' if active == 'home' }}">Firmalar</a>
    <a href="/ayarlar" class="{{ 'on' if active == 'settings' }}">Ayarlar</a>
    <a href="/cikis" class="hide-sm">Çıkış</a>
    <button type="button" class="theme-btn" id="themeBtn" aria-label="Tema: otomatik" title="Tema: otomatik">
      <svg class="ic-auto" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      <svg class="ic-light" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="ic-dark" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </nav>
</div></header>
<main class="wrap">{% block content %}{% endblock %}</main>
<div id="toast" class="toast"></div>
</body>
</html>
